<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Technical Skills Matrix</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', sans-serif;
    background: #fff;
    min-height: 100vh;
    padding: 24px;
    color: #1a2332;
  }

  .page-wrapper {
    background: #fff;
    padding: 28px 28px 36px;
    max-width: 1600px;
    margin: 0 auto;
  }

  /* ── Header ── */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    color: #1a2332;
    border-bottom: 3px solid #039be5;
    padding-bottom: 4px;
  }
.btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 0;
  width: 148px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Sarabun', sans-serif;
  cursor: pointer;
  border: 2px solid transparent;
  transition: filter .15s, transform .1s;
}
.btn:hover { filter: brightness(0.92); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

/* Evaluation — green outline (ตรงกับรูปที่ 2) */
.btn-outline {
  border: 2px solid #16a34a;
  background: #fff;
  color: #16a34a;
}

/* Select Files — blue solid */
.btn-yellow {
  background: #303f9f;
  color: #fff;
  border-color: #2563eb;
}

/* Export — dark green solid */
.btn-green {
  background: #33691e;
  color: #fff;
  border-color: #16a34a;
}

  /* ── Legend ── */
  .legend-row {
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    font-size: 13px;
    align-items: flex-start;
  }
  .legend-group { display: flex; flex-direction: column; gap: 6px; }
  .legend-label { font-size: 11px; font-weight: 700; color: #6b7280; letter-spacing: .6px; text-transform: uppercase; margin-bottom: 2px; }
  .legend-items { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .legend-item  { display: flex; align-items: center; gap: 5px; font-size: 12.5px; }
  .swatch { width: 22px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.12); }
  .sw-0 { background: #e5e7eb; }
  .sw-1 { background: #dbeafe; }
  .sw-2 { background: #93c5fd; }
  .sw-3 { background: #3b82f6; }
  .sw-4 { background: #1d4ed8; }
  .sw-5 { background: #1e3a8a; }

  /* ── Gap legend icons ── */
  .gap-icon-legend {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
	.gli-above { color: #3bff38; }
  .gli-meet  { color: #3bff38; }
  .gli-below { color: #ff1f1f; }

  /* ── Level badge ── */
  .level-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px 11px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .4px;
    border: 1.5px solid transparent;
  }
  .level-i { background: #e0f2fe; color: #0369a1; border-color: #7dd3fc; }
  .level-m { background: #fef3c7; color: #92400e; border-color: #fcd34d; }

  /* ── Table ── */
  .table-wrap {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1050px;
    font-size: 13.5px;
  }
  thead tr.cat-row th {
    background: #1a1a1a;
    color: #fff;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    padding: 10px 8px 0;
    border-left: 1px solid #333;
  }
  thead tr.cat-row th.empty { background: #1a1a1a; border-left: none; }
  thead tr.sub-row th {
    background: #1a1a1a;
    color: #bdbdbd;
    font-weight: 500;
    font-size: 11.5px;
    text-align: center;
    padding: 4px 8px 8px;
    border-left: 1px solid #333;
    white-space: nowrap;
  }
  thead tr.sub-row th.empty-sub {
    background: #1a1a1a;
    border-left: none;
    padding: 4px 8px 8px;
  }
  thead tr.sub-row th.fixed-col { text-align: left; }

  tbody tr { border-bottom: 1px solid #e2e8f0; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }
  tbody td {
    padding: 10px 14px;
    vertical-align: middle;
    white-space: nowrap;
  }
  td.name-col { font-weight: 600; color: #1a2332; min-width: 180px; vertical-align: middle; }
  td.role-col { color: #374151; min-width: 220px; white-space: normal; }
  td.eval-col { min-width: 130px; }
  td.center   { text-align: center; vertical-align: middle; }

  .role-sub {
    font-size: 11.5px;
    font-weight: 400;
    color: #6b7280;
    margin-top: 3px;
  }

  td.jobrole-col {
    min-width: 130px;
    font-size: 13px;
    color: #374151;
    font-weight: 500;
    white-space: normal;
    line-height: 1.4;
  }
  td.level-col {
    min-width: 72px;
    text-align: center;
    vertical-align: middle;
  }

  /* Group row borders */
  tr.group-first td { border-top: 2px solid #cbd5e1; }
  tr.group-last  td { border-bottom: 2px solid #cbd5e1; }
  tr.group-first.group-last td { border-top: 2px solid #cbd5e1; border-bottom: 2px solid #cbd5e1; }

  tr:not(.group-first) td.skill-cell {
    background: rgba(241,245,249,0.55);
  }

  /* ── Skill Cell ── */
  td.skill-cell {
    text-align: center;
    padding: 0;
    border-left: 1px solid #e2e8f0;
    position: relative;
  }

  .score-badge {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    min-height: 56px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    user-select: none;
    padding: 6px 4px;
    gap: 2px;
  }

  .sl-0 { background: #e5e7eb; color: #9ca3af; }
  .sl-1 { background: #dbeafe; color: #1e40af; }
  .sl-2 { background: #93c5fd; color: #1e3a8a; }
  .sl-3 { background: #3b82f6; color: #fff; }
  .sl-4 { background: #1d4ed8; color: #fff; }
  .sl-5 { background: #1e3a8a; color: #fff; }

  /* ── Gap Icon (top-right corner) ── */
  .gap-icon-badge {
    position: absolute;
    top: 5px;
    right: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    pointer-events: none;
    z-index: 2;
    background: none;
    border: none;
  }
  .gap-above { color: #3bff38; }
  .gap-meet  { color: #3bff38; }
  .gap-below { color: #ff1f1f; }

  .score-num { line-height: 1; }

  /* ── Empty score (was 0) ── */
  .score-empty {
    font-size: 20px;
    font-weight: 400;
    opacity: 0.45;
    letter-spacing: 1px;
  }

  .detail-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.45);
    color: #fff;
    border-radius: 5px;
    padding: 2px 9px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background .15s, transform .1s;
    line-height: 1.4;
  }
  .detail-btn:hover {
    background: rgba(255,255,255,0.36);
    transform: scale(1.06);
  }
  .sl-0 .detail-btn, .sl-1 .detail-btn, .sl-2 .detail-btn {
    background: rgba(0,0,0,0.09);
    border-color: rgba(0,0,0,0.18);
    color: #1e3a8a;
  }
  .sl-0 .detail-btn:hover, .sl-1 .detail-btn:hover, .sl-2 .detail-btn:hover {
    background: rgba(0,0,0,0.17);
  }

  /* ── Evaluation By ── */
  td.eval-col {
    padding: 8px 10px;
    min-width: 140px;
    text-align: center;
    vertical-align: middle;
    background: #fff;
  }
  .eval-pill {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
  }
  .eval-supervisor-pill { background: #b3e5fc; color: #01579b; }
  .eval-self-pill        { background: #fff9c4; color: #f57f17; }

  /* ── Utilization ── */
  td.util-col {
    padding: 8px 6px;
    min-width: 90px;
    text-align: center;
    vertical-align: middle;
    background: #fff;
  }
  .util-pill {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .util-red    { background: #ffcdd2; color: #c62828; }
  .util-orange { background: #ffe0b2; color: #e65100; }
  .util-yellow { background: #fff9c4; color: #f57f17; }
  .util-green  { background: #c8e6c9; color: #2e7d32; }
  .util-blue   { background: #bbdefb; color: #1565c0; }

  /* ══════════════════════════════════════
     MODAL
  ══════════════════════════════════════ */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,0.5);
    z-index: 999;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 12px 48px rgba(0,0,0,0.25);
    animation: modalIn .2s ease;
  }
  @keyframes modalIn {
    from { transform: translateY(20px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  .modal-bar {
    height: 7px;
    border-radius: 14px 14px 0 0;
    background: linear-gradient(90deg, #0277bd 0%, #29b6f6 100%);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px 14px;
    border-bottom: 1px solid #e2e8f0;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: #1a2332; }
  .modal-close {
    background: none;
    border: none;
    font-size: 18px;
    color: #9ca3af;
    cursor: pointer;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background .12s, color .12s;
  }
  .modal-close:hover { background: #f3f4f6; color: #374151; }

  .modal-body { padding: 20px 22px 26px; }

  .msec { margin-bottom: 24px; }
  .msec:last-child { margin-bottom: 0; }

  .msec-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: #374151;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #f1f5f9;
  }

  .info-table {
    width: 100%;
    border: 1px solid #e2e8f0;
    border-radius: 9px;
    overflow: hidden;
    font-size: 13.5px;
  }
  .info-table tr { border-bottom: 1px solid #e2e8f0; }
  .info-table tr:last-child { border-bottom: none; }
  .info-table td { padding: 11px 15px; vertical-align: middle; }
  .info-table td:first-child {
    font-size: 11px;
    font-weight: 700;
    color: #9ca3af;
    letter-spacing: .5px;
    text-transform: uppercase;
    width: 130px;
    background: #f9fafb;
  }
  .info-table td:last-child { color: #1a2332; font-weight: 500; }

  .avg-box {
    background: linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 100%);
    border: 1.5px solid #81d4fa;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
  }
  .avg-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: #0277bd; text-transform: uppercase; margin-bottom: 6px; }
  .avg-score { font-size: 40px; font-weight: 700; color: #0277bd; line-height: 1; }
  .avg-score span { font-size: 18px; font-weight: 500; color: #29b6f6; }

  .brand-card {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 15px 18px;
    margin-bottom: 10px;
    background: #fafafa;
  }
  .brand-card:last-of-type { margin-bottom: 0; }

  .brand-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .brand-name { font-size: 15px; font-weight: 700; color: #1a2332; letter-spacing: .3px; }
  .stars { display: flex; gap: 3px; }
  .star { font-size: 20px; }
  .star.filled  { color: #f59e0b; }
  .star.empty   { color: #d1d5db; }

  .dl-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 11px 16px;
    border-radius: 8px;
    background: #ef4444;
    color: #fff;
    border: 2px solid #fca5a5;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Sarabun', sans-serif;
    cursor: pointer;
    transition: background .15s, transform .1s, box-shadow .15s;
    box-shadow: 0 2px 8px rgba(239,68,68,0.25);
  }
  .dl-btn:hover { background: #dc2626; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(239,68,68,0.35); }
  .dl-btn:active { transform: translateY(0); }
</style>
</head>
<body>
<div class="page-wrapper">

  <!-- Header -->
  <div class="header-row">
    <div class="title">Technical Skills Matrix</div>
    <div class="btn-group">
      <button class="btn btn-outline">📝 Evaluation ▾</button>
      <button class="btn btn-yellow">📁 Select File</button>
      <button class="btn btn-green">📄 Export</button>
    </div>
  </div>

  <!-- Legend -->
  <div class="legend-row">
    <!-- Skill Level -->
    <div class="legend-group">
      <div class="legend-label">Skill Level</div>
      <div class="legend-items">
        <div class="legend-item"><div class="swatch sw-0"></div><span>1 - เริ่มต้น</span></div>
        <div class="legend-item"><div class="swatch sw-1"></div><span>2 - พื้นฐาน</span></div>
        <div class="legend-item"><div class="swatch sw-2"></div><span>3 - กลาง</span></div>
        <div class="legend-item"><div class="swatch sw-3"></div><span>4 - สูง</span></div>
        <div class="legend-item"><div class="swatch sw-4"></div><span>5 - ผู้เชี่ยวชาญ</span></div>
        <div class="legend-item"><div class="swatch sw-0" style="background:#e5e7eb;"></div><span>— ไม่มีทักษะ</span></div>
      </div>
    </div>

    <!-- Skill Gap -->
    <div class="legend-group">
      <div class="legend-label">Skill Gap</div>
      <div class="legend-items">
        <div class="legend-item">
          <span class="gap-icon-legend gli-above"><i class="fas fa-star" style="font-size:15px;"></i></span>
          <span>Meet Target + (เกินเป้า)</span>
        </div>
        <div class="legend-item">
          <span class="gap-icon-legend gli-meet"><i class="fas fa-check" style="font-size:15px;"></i></span>
          <span>Meet Target (ตรงเป้า)</span>
        </div>
        <div class="legend-item">
          <span class="gap-icon-legend gli-below"><i class="fas fa-arrow-down" style="font-size:15px;"></i></span>
          <span>Under Target (ต่ำกว่าเป้า)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table id="skillTable">
      <thead>
        <tr class="cat-row" id="catRow">
          <th class="empty" colspan="6"></th>
        </tr>
        <tr class="sub-row" id="subRow">
          <th class="empty-sub fixed-col" style="min-width:180px">Name</th>
          <th class="empty-sub fixed-col" style="min-width:150px;text-align:left">Job Role</th>
          <th class="empty-sub" style="min-width:72px;text-align:center">Level</th>
          <th class="empty-sub" style="min-width:80px;text-align:center">BU Team</th>
          <th class="empty-sub" style="min-width:90px;text-align:center">Utilization</th>
          <th class="empty-sub" style="min-width:130px;text-align:center">Evaluation By</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-bar"></div>
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>

   SKILL CATEGORIES
================================================================ */

};

/* ================================================================
   EMPLOYEES
================================================================ */
const employees = [
  {

      {

    ]
  },
  {

    role: "Software Engineer",
    jobRole: "Software Engineer",
    level: "I4",
    buTeam: "OSC", utilization: 78,
    evaluations: [
      {
        evalBy: { type: "self", name: "อภิชาติ (ตนเอง)" },
        scores: { test_mgmt: 3, test_auto: 4, perf_test: 2, frontend: 5, backend: 4, devops: 3, sql: 3, data_viz: 2 }
      },
      {

        scores: { test_mgmt: 4, test_auto: 4, perf_test: 3, frontend: 5, backend: 4, devops: 3, sql: 3, data_viz: 2 }
      }
    ]
  },
  {
    name: "นางสาวมาลี สุขสันต์",
    role: "QA Engineer",
    jobRole: "QA Engineer",
    level: "I3",
    buTeam: "QA", utilization: 60,
    evaluations: [

/* ================================================================
   HELPERS
================================================================ */
/**
 * Returns gap object:
 *   score > target  → Meet Target +  (green, fa-star)
 *   score === target → Meet Target   (green, fa-check-circle)
 *   score < target  → Under Target   (red,   fa-arrow-down)
 */
function getGapInfo(skillId, score) {
  const target = skillTargets[skillId];
  if (score > target) {
    return { label: 'Meet Target +', cssClass: 'gap-above', icon: 'fa-star',         iconStyle: 'fas' };
  } else if (score === target) {
    return { label: 'Meet Target',   cssClass: 'gap-meet',  icon: 'fa-check', iconStyle: 'fas' };
  } else {
    return { label: 'Under Target',  cssClass: 'gap-below', icon: 'fa-arrow-down',   iconStyle: 'fas' };
  }
}

function utilClass(u) {
  if (u <= 30) return "util-red";
  if (u <= 50) return "util-orange";
  if (u <= 69) return "util-yellow";
  if (u <= 85) return "util-green";
  return "util-blue";
}
function levelBadgeClass(lv) {
  return lv && lv[0].toUpperCase() === 'M' ? 'level-m' : 'level-i';
}
function renderStars(n) {
  return '<div class="stars">' +
    Array.from({length:5}, (_,i) =>
      `<span class="star ${i < n ? 'filled' : 'empty'}">★</span>`
    ).join('') + '</div>';
}
function avgBrandScore(brands) {
  if (!brands || !brands.length) return 0;
  return (brands.reduce((s,b) => s + b.stars, 0) / brands.length).toFixed(1);
}

/* ================================================================
   BUILD HEADERS
================================================================ */
const catRow = document.getElementById("catRow");
const subRow = document.getElementById("subRow");
skillCategories.forEach(cat => {
  const th = document.createElement("th");
  th.colSpan = cat.skills.length;
  th.textContent = cat.name;
  catRow.appendChild(th);
  cat.skills.forEach(skill => {
    const th2 = document.createElement("th");
    th2.textContent = skill.label;
    subRow.appendChild(th2);
  });
});

/* ================================================================
   BUILD ROWS
================================================================ */
const tbody     = document.getElementById("tableBody");
const allSkills = skillCategories.flatMap(c => c.skills);

employees.forEach((emp, empIdx) => {
  const evalCount = emp.evaluations.length;
  const uc  = utilClass(emp.utilization);
  const lvc = levelBadgeClass(emp.level);

  emp.evaluations.forEach((evalEntry, evalIdx) => {
    const tr = document.createElement("tr");

    if (evalIdx === 0)             tr.classList.add("group-first");
    if (evalIdx === evalCount - 1) tr.classList.add("group-last");
    tr.dataset.empIdx = empIdx;

    /* Merged cells — only first eval row */
    if (evalIdx === 0) {
      tr.innerHTML += `
        <td class="name-col" rowspan="${evalCount}">${emp.name}
          <div class="role-sub">${emp.role}</div>
        </td>
        <td class="jobrole-col" rowspan="${evalCount}">${emp.jobRole}</td>
        <td class="level-col" rowspan="${evalCount}">
          <span class="level-badge ${lvc}">${emp.level}</span>
        </td>
        <td class="center" rowspan="${evalCount}" style="font-weight:600;">${emp.buTeam}</td>
        <td class="util-col" rowspan="${evalCount}">
          <span class="util-pill ${uc}">${emp.utilization}%</span>
        </td>`;
    }

    /* Evaluation By */
    const evalPillCls = evalEntry.evalBy.type === "self" ? "eval-self-pill" : "eval-supervisor-pill";
    tr.innerHTML += `<td class="eval-col">
      <span class="eval-pill ${evalPillCls}">${evalEntry.evalBy.name}</span>
    </td>`;

    /* Skill scores */
    allSkills.forEach(skill => {
      const score    = evalEntry.scores[skill.id] ?? 0;
      const gap      = getGapInfo(skill.id, score);
      const badgeCls = `score-badge sl-${score}`;
      const brandKey = `${empIdx}_${evalIdx}_${skill.id}`;
      const hasBrand = !!brandAssessments[brandKey];

      /* Score display: always show number 1-5 */
      const scoreDisplay = `<span class="score-num">${score}</span>`;

      const td = document.createElement("td");
      td.className = "skill-cell";
      td.innerHTML = `
        <div class="${badgeCls}">
          ${scoreDisplay}
          <span class="gap-icon-badge ${gap.cssClass}" title="${gap.label}">
            <i class="${gap.iconStyle} ${gap.icon}" style="font-size:14px;"></i>
          </span>
          ${hasBrand
            ? `<button class="detail-btn"
                 data-emp="${empIdx}"
                 data-eval="${evalIdx}"
                 data-skill="${skill.id}">···</button>`
            : ''}
        </div>`;
      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
});

const modalBody  = document.getElementById("modalBody");

document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

document.addEventListener("click", e => {
  const btn = e.target.closest(".detail-btn");
  if (!btn) return;

  const empIdx    = +btn.dataset.emp;
  const evalIdx   = +btn.dataset.eval;
  const skillId   = btn.dataset.skill;
  const emp       = employees[empIdx];
  const evalEntry = emp.evaluations[evalIdx];
  const skill     = allSkills.find(s => s.id === skillId);
  const catName   = skillCatMap[skillId];
  const data      = brandAssessments[`${empIdx}_${evalIdx}_${skillId}`];
  const avg       = avgBrandScore(data ? data.brands : []);

  const evalInlineCls = evalEntry.evalBy.type === "self"
    ? "display:inline-block;background:#fff9c4;color:#f57f17;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12px;"
    : "display:inline-block;background:#b3e5fc;color:#01579b;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12px;";

  modalTitle.textContent = skill.label;

  let html = `
    <div class="msec">
      <div class="msec-title">📊 &nbsp;Skill Information</div>
      <table class="info-table">
        <tr><td>SKILL NAME</td><td>${catName}</td></tr>
        <tr><td>SUB SKILL</td><td>${skill.label}</td></tr>
        <tr><td>ASSESSED BY</td>
            <td><span style="${evalInlineCls}">${evalEntry.evalBy.name}</span></td></tr>
        <tr><td>JOB ROLE</td><td>${emp.jobRole}</td></tr>
        <tr><td>LEVEL</td><td><span class="level-badge ${levelBadgeClass(emp.level)}">${emp.level}</span></td></tr>
      </table>
    </div>

    <div class="msec">
      <div class="msec-title">📈 &nbsp;Overall Performance</div>
      <div class="avg-box">
        <div class="avg-label">Average Score</div>
        <div class="avg-score">${avg}<span>/5.0</span></div>
      </div>
    </div>`;

  if (data && data.brands.length) {
    html += `<div class="msec">
      <div class="msec-title">🏷️ &nbsp;Brand Assessment Details</div>`;
    data.brands.forEach(brand => {
      html += `
        <div class="brand-card">
          <div class="brand-top">
            <div class="brand-name">${brand.name}</div>
            ${renderStars(brand.stars)}
          </div>
          ${brand.hasCert ? `
          <button class="dl-btn" onclick="handleDownload('${brand.name}')">
            ⬇ &nbsp;ดาวน์โหลด Certificate (PDF)
          </button>` : ''}
        </div>`;
    });
    html += `</div>`;
  }

  modalBody.innerHTML = html;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
});

function closeModal() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}
function handleDownload(brandName) {
  alert(`กำลังดาวน์โหลด Certificate ของ ${brandName}...`);
}
